
name: Build Android APK

# AndroidForge — Universal Android APK Builder
#
# Build runs in the prebuilt Docker image.
# Signing runs separately on a clean GitHub runner.
#
# Workflow:
#   1. Acquire and extract source ZIP
#   2. Detect project type and configure toolchain
#   3. Build APK/AAB
#   4. Collect and upload unsigned APKs as an internal artifact
#   5. Upload AABs as an artifact
#   6. Sign APKs in a separate job using GitHub Secrets
#   7. Publish signed APKs and AABs to the output release
#   8. Upload build logs and diagnose failures

on:
  workflow_dispatch:
    inputs:
      zip_source:
        description: "Where should the workflow get the source ZIP from?"
        type: choice
        required: true
        default: "input-directory"
        options:
          - "input-directory"
          - "download-url"
          - "release-asset"
      zip_path:
        description: "Exact path (relative to repo root) of the source ZIP in input/"
        required: false
        type: string
        default: ""
      zip_url:
        description: "Direct download URL"
        required: false
        type: string
        default: ""
      release_tag:
        description: "GitHub Release tag containing the ZIP"
        required: false
        type: string
        default: ""
      build_variant:
        description: "Build variant to produce"
        type: choice
        required: true
        default: "auto"
        options:
          - "auto"
          - "debug"
          - "release"
          - "bundle"
      enable_ndk:
        description: "Install NDK even if no native code is detected"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write
  packages: read

concurrency:
  group: androidforge-build-${{ github.ref }}-${{ github.event.inputs.zip_source || 'auto' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    container: ghcr.io/professional-x/androidforge-build-env:latest
    timeout-minutes: 60
  env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=false"
      PYTHONUNBUFFERED: "1"

    permissions:
      contents: read
      actions: write
      packages: read

    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      build_succeeded: ${{ steps.build.outputs.build_succeeded }}
      apk_count: ${{ steps.collect.outputs.apk_count }}
      primary_apk_name: ${{ steps.collect.outputs.primary_apk_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip --quiet
          python3 -m pip install -r scripts/requirements.txt --quiet

      # Step 1: Acquire ZIP
      - name: Acquire source ZIP
        id: acquire
        run: |
          python3 scripts/acquire_zip.py \
            --source "${{ inputs.zip_source || 'input-directory' }}" \
            --url "${{ inputs.zip_url }}" \
            --tag "${{ inputs.release_tag }}" \
            --path "${{ inputs.zip_path }}"

      # Step 2: Extract ZIP
      - name: Extract source ZIP
        id: extract
        run: python3 scripts/extract_zip.py --zip "${{ steps.acquire.outputs.zip_path }}"

      # Step 3: Detect project
      - name: Detect project type
        id: detect
        run: |
          python3 scripts/detect_project.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --output detection.json
          echo "::group::Detection JSON"
          cat detection.json
          echo "::endgroup::"

      # Step 4: Configure toolchain
      - name: Configure toolchain
        id: toolchain
        run: |
          python3 scripts/setup_environment.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --android-sdk "$ANDROID_HOME" \
            --output toolchain.json
          echo "::group::Toolchain JSON"
          cat toolchain.json
          echo "::endgroup::"

      # Step 4b: Self-heal
      - name: Self-heal project
        id: self_heal
        run: |
          python3 scripts/self_heal.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --toolchain toolchain.json \
            --android-sdk "$ANDROID_HOME" \
            --output self_heal.json
          echo "::group::Self-heal report"
          cat self_heal.json
          echo "::endgroup::"

      # Step 5: Switch JAVA_HOME
      - name: Switch JAVA_HOME to detected version
        run: |
          JDK_VER="${{ steps.toolchain.outputs.jdk_version }}"
          case "$JDK_VER" in
            8)  NEW_JH=/usr/lib/jvm/java-8-openjdk-amd64 ;;
            11) NEW_JH=/usr/lib/jvm/java-11-openjdk-amd64 ;;
            17) NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64 ;;
            21) NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64 ;;
            *)  echo "Unknown JDK version: $JDK_VER — defaulting to JDK 17"
                NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64 ;;
          esac
          echo "Switching JAVA_HOME from $JAVA_HOME to $NEW_JH"
          echo "JAVA_HOME=$NEW_JH" >> "$GITHUB_ENV"
          echo "$NEW_JH/bin" >> "$GITHUB_PATH"
          java -version

      # Step 6: Install missing Android SDK components
      - name: Install missing Android SDK components
        run: |
          NEEDS_NDK="${{ steps.toolchain.outputs.needs_ndk }}"
          NDK_VER="${{ steps.toolchain.outputs.ndk_version }}"
          COMPILE_SDK=$(python3 -c "import json; d=json.load(open('detection.json')); v=d.get('versions',{}).get('compile_sdk'); print(v if v else '')")
          echo "Project compileSdk=$COMPILE_SDK"

          if [ -n "$COMPILE_SDK" ]; then
            if [ ! -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]; then
              echo "Installing missing platform: platforms;android-$COMPILE_SDK"
              yes | sdkmanager "platforms;android-$COMPILE_SDK" || true
            else
              echo "platforms;android-$COMPILE_SDK already present"
            fi
          fi

          yes | sdkmanager "platform-tools" >/dev/null 2>&1 || true

          if [ "$NEEDS_NDK" = "true" ] || [ "${{ github.event.inputs.enable_ndk }}" = "true" ]; then
            if [ -n "$NDK_VER" ] && [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
              echo "Installing NDK: ndk;$NDK_VER"
              yes | sdkmanager "ndk;$NDK_VER" || echo "WARNING: NDK install failed"
            else
              echo "NDK $NDK_VER already present (or not specified)"
            fi
            yes | sdkmanager "cmake;3.22.1" >/dev/null 2>&1 || true
          fi

      # Step 7: Switch Flutter version
      - name: Switch Flutter version
        if: steps.toolchain.outputs.needs_flutter == 'true'
        run: |
          DETECTED="${{ steps.toolchain.outputs.flutter_version }}"
          CURRENT=$(flutter --version | head -1 | awk '{print $4}')
          echo "Project Flutter version: $DETECTED, image version: $CURRENT"

          if [ "$DETECTED" != "$CURRENT" ] && [ -n "$DETECTED" ]; then
            flutter downgrade "$DETECTED" 2>/dev/null || flutter --version "$DETECTED" 2>/dev/null || true
            flutter --version
          else
            echo "Flutter $CURRENT already satisfies the project"
          fi

          flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop || true

      # Step 8: Restore Gradle cache
      - name: Restore Gradle cache
        if: steps.toolchain.outputs.needs_gradle == 'true'
        uses: actions/cache@v4
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
            ${{ steps.extract.outputs.project_root }}/.gradle
          key: gradle-${{ runner.os }}-${{ steps.toolchain.outputs.gradle_version }}
          restore-keys: |
            gradle-${{ steps.toolchain.outputs.gradle_version }}-
            gradle-

      # Step 9: Restore Flutter cache
      - name: Restore Flutter pub cache
        if: steps.toolchain.outputs.needs_flutter == 'true'
        uses: actions/cache@v4
        with:
          path: /root/.pub-cache
          key: flutter-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-

      # Step 10: Verify standalone Gradle
      - name: Verify standalone Gradle
        if: steps.toolchain.outputs.use_wrapper == 'false'
        run: |
          GRADLE_VER="${{ steps.toolchain.outputs.gradle_version }}"
          echo "Image has Gradle 8.9 at /opt/gradle/bin/gradle"
          which gradle
          gradle --version | head -3

          if [ -n "$GRADLE_VER" ] && [ "$GRADLE_VER" != "8.9" ] && [ "$GRADLE_VER" != "8.0" ]; then
            REQ_MAJOR=$(echo "$GRADLE_VER" | cut -d. -f1)
            if [ "$REQ_MAJOR" -lt 8 ]; then
              echo "Project wants older Gradle $GRADLE_VER — downloading..."
              wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -O /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /opt
              echo "/opt/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
            else
              echo "Image Gradle 8.9 satisfies the project's requirement"
            fi
          fi

      # Step 11: Build project
      - name: Build project
        id: build
        continue-on-error: true
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/build_project.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --variant "${{ inputs.build_variant || 'auto' }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" \
            --output "$GITHUB_WORKSPACE/build.json" || true

          if [ ! -f "$GITHUB_WORKSPACE/build.json" ]; then
            echo '{"build_succeeded": false, "successful_command": null, "exit_code": -1, "log_file": null}' > "$GITHUB_WORKSPACE/build.json"
          fi

          cat "$GITHUB_WORKSPACE/build.json"

      # Step 12: Collect APKs
      - name: Collect APKs
        id: collect
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/collect_apk.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --variant "${{ inputs.build_variant || 'auto' }}" \
            --output-dir "$GITHUB_WORKSPACE/output" \
            --output-json "$GITHUB_WORKSPACE/collect.json" || true

          if [ ! -f "$GITHUB_WORKSPACE/collect.json" ]; then
            echo '{"apk_count": 0, "primary": null, "all_apks": []}' > "$GITHUB_WORKSPACE/collect.json"
          fi

          cat "$GITHUB_WORKSPACE/collect.json"

      # Step 13: Upload unsigned APK artifact
      - name: Upload unsigned APK artifact
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-APKs-unsigned
          path: ${{ steps.collect.outputs.apk_directory }}/*.apk
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      - name: Upload AAB artifact
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-AAB
          path: ${{ steps.collect.outputs.apk_directory }}/*.aab
          if-no-files-found: ignore
          retention-days: 30

      # Step 14: Upload build logs
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-logs
          path: |
            .androidforge/logs/
            ${{ steps.extract.outputs.project_root }}/build/outputs/
            ${{ steps.extract.outputs.project_root }}/**/build/reports/
            ${{ steps.extract.outputs.project_root }}/**/build/outputs/
          if-no-files-found: ignore
          retention-days: 14

      # Step 15: Diagnose failure
      - name: Diagnose failure
        if: steps.build.outputs.build_succeeded != 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/diagnose_failure.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" || true

      # Step 16: Build summary
      - name: Build summary
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/build_summary.py" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --build "$GITHUB_WORKSPACE/build.json" \
            --collect "$GITHUB_WORKSPACE/collect.json" || true

          if [ -f "$GITHUB_WORKSPACE/self_heal.json" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Self-heal report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_WORKSPACE/self_heal.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Final: fail if build failed
      - name: Fail if build failed
        if: steps.build.outputs.build_succeeded != 'true'
        run: |
          echo "::error::Android build failed. See AndroidForge-logs artifact."
          exit 1

  # Separate signing job.
  # It does not run inside the AndroidForge build container.
  # The uploaded source ZIP and its Gradle scripts never receive signing secrets.
  sign:
    name: Sign Release APK
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.apk_count != '0' && needs.build.outputs.apk_count != ''

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@v4
        with:
          name: AndroidForge-APKs-unsigned
          path: unsigned

      - name: Download AAB artifact
        id: download_aab
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: AndroidForge-AAB
          path: aab

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "build-tools;35.0.0"

      - name: Sign and verify APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          KEYSTORE="$RUNNER_TEMP/mdmesh-release.jks"
          mkdir -p signed

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          shopt -s nullglob
          APK_FILES=(unsigned/*.apk)

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "::error::No APK files found"
            exit 1
          fi

          for APK in "${APK_FILES[@]}"; do
            NAME=$(basename "$APK")
            echo "Signing $NAME"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias mdmesh \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "signed/$NAME" \
              "$APK"

            "$APKSIGNER" verify --verbose "signed/$NAME"
          done

          rm -f "$KEYSTORE"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-APKs
          path: signed/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # Create output release and publish signed APKs.
      # AABs, if present, are also published unchanged.
      - name: Publish signed APKs and AABs to output release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="web-build-output-${{ github.run_id }}"
          REPO_API="https://api.github.com/repos/$GITHUB_REPOSITORY"

          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          API_VERSION="X-GitHub-Api-Version: 2022-11-28"
          ACCEPT="Accept: application/vnd.github+json"

          echo "Creating output release: $TAG"

          RELEASE_RESPONSE=$(curl -sS -X POST \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT" \
            -H "$API_VERSION" \
            -H "Content-Type: application/json" \
            "$REPO_API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"main\",\"name\":\"Build #${{ github.run_number }} output\",\"body\":\"Auto-generated by AndroidForge workflow run ${{ github.run_id }}.\",\"prerelease\":true}")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "Release may already exist. Looking it up..."
            RELEASE_ID=$(curl -sS \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT" \
              -H "$API_VERSION" \
              "$REPO_API/releases/tags/$TAG" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not create or find release $TAG"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi

          echo "Release ID: $RELEASE_ID"

          shopt -s nullglob
          FILES=(signed/*.apk)

          if [ -d aab ]; then
            FILES+=(aab/*.aab)
          fi

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No APK or AAB files found for publishing"
            exit 1
          fi

          for FILE in "${FILES[@]}"; do
            [ -f "$FILE" ] || continue
            NAME=$(basename "$FILE")

            echo "Uploading $NAME"

            UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME"

            HTTP_CODE=$(curl -sS -X POST \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT" \
              -H "$API_VERSION" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE" \
              -o /tmp/upload-response.json \
              -w "%{http_code}" \
              "$UPLOAD_URL")

            if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Uploaded $NAME (HTTP $HTTP_CODE)"
            else
              echo "::error::Upload failed for $NAME (HTTP $HTTP_CODE)"
              cat /tmp/upload-response.json
              exit 1
            fi
          done

          {
            echo "## Signed APK release"
            echo ""
            echo "Tag: \`$TAG\`"
            echo ""
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Signing summary
        if: always()
        run: |
          echo "## APK signing job" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK signing and verification results are shown in the steps above." >> "$GITHUB_STEP_SUMMARY"
